<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GymAI • Entrar</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="login"><form id="login"><h1>Entrar no GymAI</h1><label>Usuário<input name="username" autocomplete="username" required></label><label>Senha<input name="password" type="password" autocomplete="current-password" required></label><button>Entrar</button><p id="error" class="muted"></p></form></main><script>document.querySelector('#login').onsubmit=async e=>{e.preventDefault();let f=e.target;let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:f.username.value,password:f.password.value})});if(r.ok)location.href='/';else document.querySelector('#error').textContent='Credenciais inválidas';}</script></body></html>
